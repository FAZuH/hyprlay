name: Build

on:
  workflow_call:
    inputs:
      cargo-build-args:
        description: 'Arguments to pass to cargo build'
        required: false
        type: string
        default: '--all-features --all-targets'
      upload-binary:
        description: 'Whether to upload the binary artifact'
        required: false
        type: boolean
        default: false
      release:
        description: 'Whether this is a release build (affects artifact path)'
        required: false
        type: boolean
        default: false
      require-patched-cargo:
        description: 'Fail if patched Cargo.toml artifact is not found'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binary:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            exe: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x64
            exe: .exe
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x64
            exe: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
            exe: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.target }}"
          add-job-id-key: false

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config

      - name: Download Patched Cargo.toml
        id: download-cargo
        uses: actions/download-artifact@v4
        with:
          name: patched-cargo-toml
          path: .
        continue-on-error: true

      - name: Verify Patched Cargo.toml
        if: inputs.require-patched-cargo && steps.download-cargo.outcome == 'failure'
        run: |
          echo "::error::Patched Cargo.toml artifact is required but was not found. Ensure patch-version ran before this job."
          exit 1

      - name: Verify workspace dependency consistency
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! grep -q '^\[workspace\]' Cargo.toml; then
            echo "No workspace — skipping consistency check"
            exit 0
          fi
          MEMBERS=$(find crates -maxdepth 2 -name Cargo.toml -exec dirname {} \; | sed 's|^crates/||' | sort -u)
          if [ -z "$MEMBERS" ]; then
            echo "No workspace members — skipping consistency check"
            exit 0
          fi

          ERRORS=0
          for member in $MEMBERS; do
            PKG=$(grep '^name = ' "crates/$member/Cargo.toml" | head -1 | sed 's/name = "\(.*\)"/\1/')
            MEMVER=$(grep '^version = ' "crates/$member/Cargo.toml" | head -1 | sed 's/version = "\(.*\)"/\1/')
            WSVER=$(awk -v pkg="$PKG" '\
              $1 == "[workspace.dependencies]" { in_ws = 1; next } \
              in_ws && /^\[/ { in_ws = 0; next } \
              in_ws && $1 == pkg { match($0, /version = "([^"]+)"/, a); print a[1]; exit } \
            ' Cargo.toml)

            if [ -z "$WSVER" ]; then
              echo "  $PKG: no workspace dep entry (external dep) — skipped"
            elif [ "$MEMVER" != "$WSVER" ]; then
              echo "::error::$PKG: member=$MEMVER workspace=$WSVER — MISMATCH"
              ERRORS=$((ERRORS + 1))
            else
              echo "  $PKG: $MEMVER ✓"
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Workspace dependency consistency check failed ($ERRORS error(s))"
            exit 1
          fi

      - name: Build
        run: cargo build --target ${{ matrix.target }} ${{ inputs.cargo-build-args }}

      - name: Prepare Artifact (Unix)
        if: matrix.os != 'windows-latest' && inputs.upload-binary
        run: |
          mkdir -p artifacts
          PROFILE=${{ inputs.release && 'release' || 'debug' }}
          for b in hyprlay hyprlayd hyprlay-gui hyprlay-tray; do
            cp "target/${{ matrix.target }}/$PROFILE/$b" "artifacts/$b-${{ matrix.platform }}"
            chmod +x "artifacts/$b-${{ matrix.platform }}"
          done

      - name: Prepare Artifact (Windows)
        if: matrix.os == 'windows-latest' && inputs.upload-binary
        run: |
          mkdir artifacts
          copy "target\${{ matrix.target }}\${{ inputs.release && 'release' || 'debug' }}\hyprlay.exe" "artifacts\hyprlay-${{ matrix.platform }}.exe"
          copy "target\${{ matrix.target }}\${{ inputs.release && 'release' || 'debug' }}\hyprlayd.exe" "artifacts\hyprlayd-${{ matrix.platform }}.exe"
          copy "target\${{ matrix.target }}\${{ inputs.release && 'release' || 'debug' }}\hyprlay-gui.exe" "artifacts\hyprlay-gui-${{ matrix.platform }}.exe"
          copy "target\${{ matrix.target }}\${{ inputs.release && 'release' || 'debug' }}\hyprlay-tray.exe" "artifacts\hyprlay-tray-${{ matrix.platform }}.exe"

      - name: Upload Binary Artifact (hyprlay)
        if: inputs.upload-binary
        uses: actions/upload-artifact@v4
        with:
          name: hyprlay-${{ matrix.platform }}${{ matrix.exe }}
          path: artifacts/hyprlay-${{ matrix.platform }}${{ matrix.exe }}
          retention-days: 3

      - name: Upload Binary Artifact (hyprlayd)
        if: inputs.upload-binary
        uses: actions/upload-artifact@v4
        with:
          name: hyprlayd-${{ matrix.platform }}${{ matrix.exe }}
          path: artifacts/hyprlayd-${{ matrix.platform }}${{ matrix.exe }}
          retention-days: 3

      - name: Upload Binary Artifact (hyprlay-gui)
        if: inputs.upload-binary
        uses: actions/upload-artifact@v4
        with:
          name: hyprlay-gui-${{ matrix.platform }}${{ matrix.exe }}
          path: artifacts/hyprlay-gui-${{ matrix.platform }}${{ matrix.exe }}
          retention-days: 3

      - name: Upload Binary Artifact (hyprlay-tray)
        if: inputs.upload-binary
        uses: actions/upload-artifact@v4
        with:
          name: hyprlay-tray-${{ matrix.platform }}${{ matrix.exe }}
          path: artifacts/hyprlay-tray-${{ matrix.platform }}${{ matrix.exe }}
          retention-days: 3
